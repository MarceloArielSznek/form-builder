# Nginx site for forms.yallaprojects.com → PM2 (Vite preview on 127.0.0.1:4173).
# Copy or include from sites-enabled; adjust TLS paths if using Cloudflare Full (strict).

server {
    listen 80;
    listen [::]:80;
    server_name forms.yallaprojects.com;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

